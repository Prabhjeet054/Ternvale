[package]
name = "ternvale-snapshot"
description = "Layered copy-on-write disk images for Ternvale virtio-blk."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
# AES-256-XTS on COW layer payloads; AES-256-GCM on memory-snapshot files.
ternvale-crypto = { path = "../ternvale-crypto" }

[lints]
workspace = true
