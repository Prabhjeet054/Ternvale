[package]
name = "ternvale-net"
description = "User-mode NAT and the unprivileged vmnet helper protocol."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Typed UserError / helper IO errors.
thiserror = "2"
tracing = "0.1"
# Unprivileged ICMP datagram sockets and non-blocking TCP connect.
libc = "0.2"
# NicPolicy / CidrPort compiled into the enforcement engine.
ternvale-config = { path = "../ternvale-config" }

[lints]
workspace = true
