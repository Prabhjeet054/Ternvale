[package]
name = "ternvale-agent"
description = "In-guest Ternvale agent: connects to the host over vsock and answers its requests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ternvale-agent"
path = "src/main.rs"

[dependencies]
ternvale-agent-proto = { path = "../ternvale-agent-proto" }
# Typed AgentError (library code; no anyhow outside ternvale-cli).
thiserror = "2"
tracing = "0.1"
# SHA-256 of guest files for copy checksums (already in the workspace).
sha2 = "0.10"
# stderr log output for the binary, level from TERNVALE_AGENT_LOG.
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Safe AF_VSOCK stream (rust-vsock); keeps this crate free of raw socket FFI.
vsock = "0.5"
# Safe sync(2) / reboot(2) wrappers for the Shutdown request.
nix = { version = "0.31", default-features = false, features = ["fs", "reboot", "time"] }

[target.'cfg(windows)'.dependencies]
# SCM dispatch (`--service`) and typed service status updates.
windows-service = "0.7"
# Winsock for virtio-win `viosock` (AF_VSOCK). Raw sockets stay behind
# `windows_vsock.rs` because rust-vsock does not target Windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
