[package]
name = "ternvale-devices"
description = "Emulated and virtio devices for Ternvale guests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Builds tests/boot.rs, the hypervisor boot harness. `cargo test --workspace` skips it.
boot-test = []
# Stub vmnet.framework (shared mode) virtio-net backend. Off by default; see docs/NET.md.
vmnet = []

[[test]]
name = "boot"
path = "tests/boot/main.rs"
harness = false
required-features = ["boot-test"]

[dependencies]
# Typed UartError.
thiserror = "2"
# Register, TX, and interrupt-stub logs on ternvale::uart.
tracing = "0.1"
# MmioDevice so the PL011 can be registered on the guest MMIO bus.
ternvale-vmm = { path = "../ternvale-vmm" }
# fill_entropy (safe getentropy wrapper) for virtio-rng; raw FFI stays in ternvale-hv.
ternvale-hv = { path = "../ternvale-hv" }

[dev-dependencies]
# Capture stdout while the hello payload writes through the real PL011.
libc = "0.2"
# Log file checks in unit tests.
ternvale-log = { path = "../ternvale-log" }
# VmConfig for the Linux boot test.
ternvale-config = { path = "../ternvale-config" }
