[package]
name = "ternvale-devices"
description = "Emulated and virtio devices for Ternvale guests."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Builds tests/boot.rs, the hypervisor boot harness. `cargo test --workspace` skips it.
boot-test = []
# Stub vmnet.framework (shared mode) virtio-net backend. Off by default; see docs/NET.md.
vmnet = []

[[test]]
name = "boot"
path = "tests/boot/main.rs"
harness = false
required-features = ["boot-test"]

[dependencies]
# Typed UartError.
thiserror = "2"
# Register, TX, and interrupt-stub logs on ternvale::uart.
tracing = "0.1"
# MmioDevice so the PL011 can be registered on the guest MMIO bus.
ternvale-vmm = { path = "../ternvale-vmm" }
# fill_entropy (safe getentropy wrapper) for virtio-rng; raw FFI stays in ternvale-hv.
ternvale-hv = { path = "../ternvale-hv" }
# Host side of the guest agent protocol (AgentServer).
ternvale-agent-proto = { path = "../ternvale-agent-proto" }
# BlockDevice / VirtioTransport: attach_blocks places a config's disks and [iso] slots
# (workspace crate, already built through ternvale-vmm).
ternvale-config = { path = "../ternvale-config" }

[dev-dependencies]
# AgentServer tests run the real agent loop over a Unix socket.
ternvale-agent = { path = "../ternvale-agent" }
# Capture stdout while the hello payload writes through the real PL011.
libc = "0.2"
# Log file checks in unit tests.
ternvale-log = { path = "../ternvale-log" }
# Expected ACPI tables for the firmware-acpi boot scenario (what EDK2 installed vs the builder).
ternvale-acpi = { path = "../ternvale-acpi" }
# firmware-tpm boot scenario: read the TPM identity from the swtpm state file host-side
# between boots (workspace crate, already built through ternvale-vmm).
ternvale-tpm = { path = "../ternvale-tpm" }
# gpu boot scenario: VirtioGpu on virtio-mmio and its host-side frame (workspace crate;
# it depends on this one, which Cargo allows for dev-dependencies).
ternvale-gpu = { path = "../ternvale-gpu" }
