[package]
name = "ternvale-vmm"
description = "Virtual machine lifecycle, vCPU, and memory orchestration."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# mmap, munmap, and sysconf(_SC_PAGESIZE) for guest RAM. Hypervisor FFI stays in ternvale-hv.
libc = "0.2"
# SHA-256 of the raw guest payload logged at load time.
sha2 = "0.10"
# Typed MemoryError.
thiserror = "2"
# hv_vm_map / hv_vm_unmap wrappers and HvError.
ternvale-hv = { path = "../ternvale-hv" }
# VmConfig is the orchestrator's input document.
ternvale-config = { path = "../ternvale-config" }
# Map, unmap, and rejected GPA access logs.
tracing = "0.1"
# Build the guest device tree (FDT) without linking libfdt.
vm-fdt = "0.3.0"

[dev-dependencies]
# Log file checks in unit tests.
ternvale-log = { path = "../ternvale-log" }
