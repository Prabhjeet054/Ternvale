[package]
name = "ternvale-usb-host"
description = "macOS host USB device claim and transfer backend for Ternvale passthrough (IOKit)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.5"
mach2 = "0.4"
thiserror = "2"
tracing = "0.1"
ternvale-config = { path = "../ternvale-config" }
ternvale-usb = { path = "../ternvale-usb" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
