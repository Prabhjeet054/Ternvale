[package]
name = "ternvale-hv"
description = "Safe wrappers around Hypervisor.framework."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# vmnet.framework FFI (shared/NAT). Used only by ternvale-vmnetd.
vmnet = []

[build-dependencies]
# Compile vmnet_shim.c when the vmnet feature is on.
cc = "1"

[dependencies]
# Typed HvError for hv_return_t.
thiserror = "2"
# log_hv_call! for every Hypervisor.framework call.
ternvale-log = { path = "../ternvale-log" }
# Spans on the safe Vm API and the single-VM guard.
tracing = "0.1"

[lints]
workspace = true
