[package]
name = "ternvale-cli"
description = "Command-line interface for the Ternvale VMM."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ternvale"
path = "src/main.rs"

[dependencies]
# Error context for every CLI failure. The only crate allowed to use anyhow.
anyhow = "1"
# `ternvale run|validate|create-disk|status|pause|resume|stop` argument parsing.
clap = { version = "4.5", features = ["derive"] }
# Control socket JSON-lines requests and responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Required project-wide logging facade (target ternvale::cli).
tracing = "0.1"
# Log files, panic hook, and the stderr layer.
ternvale-log = { path = "../ternvale-log" }
# VmConfig loading and validation.
ternvale-config = { path = "../ternvale-config" }
# Machine, VmControl (lifecycle state machine and pause/resume).
ternvale-vmm = { path = "../ternvale-vmm" }
# PL011 serial, virtio-blk/net/vsock attachment and the agent server for `run`.
ternvale-devices = { path = "../ternvale-devices" }
# AGENT_PORT: where `run` puts the agent server's host socket.
ternvale-agent-proto = { path = "../ternvale-agent-proto" }
# `doctor`: macOS version, kern.hv_support, and a probe VM + GIC through the safe wrappers.
ternvale-hv = { path = "../ternvale-hv" }
# Run manifest start time and report file stamps (same features as ternvale-log; already in the tree).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `doctor` disk-space check: safe statfs wrapper (already in the tree via ternvale-agent),
# so no raw FFI outside ternvale-hv.
nix = { version = "0.31", default-features = false, features = ["fs"] }
# `report`: write the crash-report .zip. Deflate only (pure-Rust zlib-rs backend); no
# bzip2/lzma/zstd/aes C code. MIT, actively maintained.
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# Status tests connect the real agent loop to the agent server.
ternvale-agent = { path = "../ternvale-agent" }
